<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk / Daftar — DompetKu</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <a href="index.html" class="back-link">← Kembali ke Beranda</a>
    <h2 id="auth-title">Masuk ke Akun</h2>
    <p id="auth-subtitle" class="text-muted">Lanjutkan mengelola keuanganmu.</p>

    <form id="auth-form">
      <div class="form-group" id="name-group" style="display: none;">
        <label for="name">Nama Lengkap</label>
        <input type="text" id="name" placeholder="Masukkan nama kamu">
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="nama@email.com">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>

      <button type="submit" id="auth-submit" class="btn btn-primary btn-block">Masuk</button>
    </form>

    <p class="auth-switch">
      <span id="switch-text">Belum punya akun?</span>
      <a href="#" id="switch-btn">Daftar di sini</a>
    </p>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
